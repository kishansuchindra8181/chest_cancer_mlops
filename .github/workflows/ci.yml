
name: Chest Cancer MLOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ==========================================
  # JOB 1: RUN API TESTS
  # ==========================================
  test:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  # ==========================================
  # JOB 2: BUILD AND PUSH TO DOCKER HUB
  # ==========================================
  docker-build:
    name: Build and Push Docker Hub Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "ERROR: DOCKERHUB_TOKEN is missing"
            exit 1
          fi
          echo "Docker Hub token is available"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: deepakchaudhary11
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker Hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            deepakchaudhary11/chest-cancer-mlops:latest
            deepakchaudhary11/chest-cancer-mlops:${{ github.sha }}

  # ==========================================
  # JOB 3: BUILD AND PUSH TO GITHUB CONTAINER REGISTRY
  # ==========================================
  publish-ghcr:
    name: Publish to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/codewithdeepakchaudhary/chest-cancer-mlops:latest
            ghcr.io/codewithdeepakchaudhary/chest-cancer-mlops:${{ github.sha }}
